name: Security Scan

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run security scanners
        id: scan
        run: |
          # GitHub Actions runs `run:` blocks as `bash -eo pipefail` by default, on top of
          # the `set -uo pipefail` below — so ANY unguarded non-zero exit anywhere in this
          # script (including inside a scanner .sh, propagated through the pipe under
          # pipefail) aborts the step immediately with a bare "exit code 1" and no context.
          # The pass/fail signal here is the LOG CONTENT (grep for [CRITICAL]/[HIGH]), not
          # each scanner's own exit code, so every scanner invocation is `|| true`-guarded.
          set -uo pipefail
          mkdir -p /tmp/security-scan
          FAIL=0
          for script in scan_secrets scan_code_patterns scan_prompt_injection scan_configs; do
            echo "::group::$script"
            bash "scripts/security/${script}.sh" . | tee "/tmp/security-scan/${script}.log" || true
            echo "::endgroup::"
            if grep -qE '\[(CRITICAL|HIGH)\]' "/tmp/security-scan/${script}.log"; then
              FAIL=1
            fi
          done

          if [ -f package.json ]; then
            echo "::group::scan_dependencies"
            bash scripts/security/scan_dependencies.sh . | tee /tmp/security-scan/scan_dependencies.log || true
            echo "::endgroup::"
            if grep -qE '\[(CRITICAL|HIGH)\]' /tmp/security-scan/scan_dependencies.log; then
              FAIL=1
            fi
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo "Security scan found CRITICAL/HIGH issues — see the logs above."
            exit 1
          fi
          echo "No CRITICAL/HIGH findings."

      - name: Upload scan logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-scan-logs
          path: /tmp/security-scan/
